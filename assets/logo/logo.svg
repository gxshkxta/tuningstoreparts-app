<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 48 48"
     width="48" height="48"
     role="img" aria-label="TuningStoreParts">
    <!-- Кръг (контур на двигател) -->
    <circle cx="24" cy="24" r="20"
            fill="none"
            stroke="#2f4f6b"
            stroke-width="2.5"/>
    <!-- Вътрешен механичен елемент — опростен бутал/зъбно колело -->
    <circle cx="24" cy="24" r="6"
            fill="none"
            stroke="#2f4f6b"
            stroke-width="2.5"/>
    <!-- Спици (механични ребра) -->
    <g stroke="#2f4f6b" stroke-width="2.5" stroke-linecap="round">
        <line x1="24" y1="6"  x2="24" y2="12"/>
        <line x1="24" y1="36" x2="24" y2="42"/>
        <line x1="6"  y1="24" x2="12" y2="24"/>
        <line x1="36" y1="24" x2="42" y2="24"/>
    </g>
    <!-- Малък акцент — точка вдясно горе -->
    <circle cx="36" cy="12" r="2" fill="#2f4f6b"/>
</svg>